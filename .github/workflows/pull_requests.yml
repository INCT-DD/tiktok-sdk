name: Python Package Release Test
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  test-release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup dummy git user
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
    - name: Checkout main and rebase
      run: |
        git checkout main
        git rebase origin/${{ github.head_ref }}
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: true
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version-file: ".python-version"
    - name: Install dependencies
      run: uv sync --locked
    - name: Python Semantic Release
      uses: python-semantic-release/python-semantic-release@v10.7.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        no_operation_mode: true
        verbosity: 2